<!DOCTYPE html>
<html lang="en">

<title>Dhawan Mall - Upto 90% OFF</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#e3e6e6}
.header{background:#131921;color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.logo{font-weight:900;font-size:20px;white-space:nowrap}
.search{flex:1;display:flex;height:40px}
.search input{flex:1;padding:0 10px;border:none;border-radius:4px 0 0 4px;outline:none;font-size:14px}

.banner{background:linear-gradient(90deg,#ff8a00,#ffc400);padding:10px;text-align:center;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;padding:10px;border-radius:8px;display:flex;flex-direction:column}
.card img{width:100%;height:160px;object-fit:contain;background:#fff}
.title{font-size:13px;margin:6px 0;height:32px;overflow:hidden;line-height:16px}
.mrp{font-size:12px;color:#565959;text-decoration:line-through}
.price{color:#B12704;font-weight:bold;font-size:16px}
.offer{color:#067d62;font-size:12px;font-weight:bold}
.btn{margin-top:auto;background:#ffd814;border:1px solid #fcd200;padding:8px;border-radius:20px;font-size:13px;cursor:pointer}
.btn:active{background:#f7ca00}
#loading{text-align:center;padding:40px;font-size:18px}
</style>
</head>

    cur+=c;
  }
  if(cur) { row.push(cur); rows.push(row); }
  return rows;
}
