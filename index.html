<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhawan Mall</title>
<style>body{margin:0;font-family:Arial;background:#e3e6e6}.h{background:#131921;color:#fff;padding:12px;font-weight:900;display:flex;gap:10px;position:sticky;top:0}.s{flex:1;display:flex}.s input{flex:1;padding:8px;border:none;border-radius:4px 0 0 4px}.s button{border:none;background:#febd69;padding:0 12px;border-radius:0 4px 4px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.c{background:#fff;padding:10px;border-radius:8px}.c img{width:100%;height:150px;object-fit:contain;background:#f5f5f5}.p{color:#B12704;font-weight:bold}</style>
</head><body>
<div class="h"><div>DHAWAN MALL</div><div class="s"><input id="q" placeholder="Search Dhawan Mall" onkeyup="search()"><button onclick="search()">🔍</button></div></div>
<div id="msg" style="text-align:center;padding:30px;font-size:18px">Loading your products...</div>
<div id="list" class="g"></div>
<script>
const URL="https://docs.google.com/spreadsheets/d/1xdVlcU-AZsWrduaNkB8fTfeC53iIl6xhxJVFFFTIIQQ/export?format=csv";
let ALL=[];
fetch(URL).then(r=>r.text()).then(t=>{
  let rows=t.split('\n').slice(1);
  ALL=rows.map(r=>{
    // Name, price, Mr, category
    let c=r.split(',');
    let name=(c[0]||'').replace(/"/g,'').trim();
    let price=parseInt((c[1]||'').replace(/[^0-9]/g,''));
    let mrp=parseInt((c[2]||'').replace(/[^0-9]/g,''))||Math.floor(price*1.3);
    let cat=(c[3]||'').replace(/"/g,'').trim()||'General';
    if(!name ||!price) return null;
    // Image nahi hai toh category ke hisab se auto image
    let img=`https://via.placeholder.com/300x300.png?text=${encodeURIComponent(cat)}`;
    return {name,price,mrp,cat,img};
  }).filter(Boolean);
  document.getElementById('msg').style.display='none';
  if(ALL.length==0) document.getElementById('msg').innerHTML='Sheet khali hai, product add karo';
  else show(ALL);
}).catch(e=>{document.getElementById('msg').innerHTML='Error: '+e});
function show(arr){
  document.getElementById('list').innerHTML=arr.map(p=>`
    <div class="c">
      <img src="${p.img}">
      <div style="font-size:12px;color:#067d62;font-weight:bold">${p.cat}</div>
      <div style="font-size:13px;margin:4px 0;height:32px;overflow:hidden">${p.name}</div>
      <div class="p">₹${p.price}</div><div style="font-size:12px;text-decoration:line-through">M.R.P ₹${p.mrp}</div>
      <button style="width:100%;margin-top:6px;background:#ffd814;border:1px solid #fcd200;padding:7px;border-radius:20px" onclick="alert('Added to cart: ${p.name}')">Add to Cart</button>
    </div>
  `).join('');
}
function search(){
  let k=document.getElementById('q').value.toLowerCase();
  show(ALL.filter(p=>p.name.toLowerCase().includes(k) || p.cat.toLowerCase().includes(k)));
}
</script>
</body></html>
