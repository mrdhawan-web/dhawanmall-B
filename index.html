<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhawan Mart 1-99000</title>
<style>
#toast{position:fixed;top:15px;right:15px;z-index:9999}
.toast{padding:10px 16px;border-radius:8px;color:#fff;margin:5px;font-weight:600}
.success{background:#16a34a} .error{background:#dc2626}
.card{background:#fff;border-radius:10px;padding:10px;margin:8px}
</style>
</head><body>
<div id="toast"></div>
<h2>Dhawan Mart <small>1₹ - 99000₹</small></h2>
<div id="userBox"></div>

<div id="loginBox">
<input id="cName" placeholder="Aapka Naam">
<input id="cPhone" placeholder="10 digit Mobile">
<input id="cPin" type="password" placeholder="4 Digit PIN" maxlength="4">
<button onclick="login()">Continue</button>
</div>

<div id="products" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div>

<script>
function toast(m,t){let d=document.createElement('div');d.className='toast '+t;d.innerText=m;document.getElementById('toast').appendChild(d);setTimeout(()=>d.remove(),3000)}

function login(){
 let n=cName.value.trim(), ph=cPhone.value.trim(), pin=cPin.value.trim();
 if(n.length<2) return toast('Naam likho','error');
 if(!/^[6-9]\d{9}$/.test(ph)) return toast('Sahi number dalo','error');
 if(!/^\d{4}$/.test(pin)) return toast('4 digit PIN','error');
 let key='dm_'+ph, old=localStorage.getItem(key);
 if(old){ if(JSON.parse(old).pin!==pin) return toast('Galat PIN','error'); }
 else { localStorage.setItem(key,JSON.stringify({name:n,phone:ph,pin:pin})); toast('Account ban gaya +50 Points','success'); }
 localStorage.setItem('dm_cur',ph); showUser();
}
function showUser(){
 let ph=localStorage.getItem('dm_cur'); if(!ph) return;
 let u=JSON.parse(localStorage.getItem('dm_'+ph));
 document.getElementById('userBox').innerHTML=`<div class="card"><b>${u.name}</b> - ${u.phone} <button onclick="logout()">Logout</button></div>`;
 document.getElementById('loginBox').style.display='none';
}
function logout(){localStorage.removeItem('dm_cur');location.reload()}

// 1 to 99000 Products - abhi demo, kal sheet se ayenge
const demo=[
 {name:'Toffee 1Rs',price:1,mrp:1,img:'https://via.placeholder.com/150'},
 {name:'Parle-G 5Rs',price:5,mrp:5,img:'https://via.placeholder.com/150'},
 {name:'iPhone 15',price:70999,mrp:79900,img:'https://via.placeholder.com/150?text=iPhone'},
 {name:'LED TV 55"',price:42000,mrp:99000,img:'https://via.placeholder.com/150?text=TV'},
];
document.getElementById('products').innerHTML=demo.map(p=>`
 <div class="card"><img src="${p.img}" width="100%"><br>${p.name}<br>
 <b style="color:green">₹${p.price}</b> <s>₹${p.mrp}</s><br>
 <button onclick="order('${p.name}',${p.price})">Add to Cart</button></div>
`).join('');

async function order(name,price){
 let ph=localStorage.getItem('dm_cur'); let u=JSON.parse(localStorage.getItem('dm_'+ph));
 toast(name+' Added','success');
 // Safe call - token backend me hai
 fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:u,product:name,price})});
}
showUser();
</script>
</body>
</html>
