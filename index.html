<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhawan Mall</title>
<style>
  body{
    margin:0;
    font-family:Arial;
    background:#e3e6e6
  }
  .h{
    background:#131921;
     color:#fff;
     padding:12px;
     font-weight:900;
     display:flex;
     gap:10px;
     position:sticky;
     top:0
  }
  .s{
    flex:1;
     display:flex
  }
  .s input{
    flex:1;
    padding:8px;
    border:none;
    border-radius:4px 0 0 4px
  }
  .s button{
    border:none;
    background:#febd69;
    padding:0 12px;
    border-radius:0 4px 4px 0
  }
  .g{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;padding:8px
  }
  .c{
    background:#fff;
    padding:10px;
    border-radius:8px
  }
  .c img{
    width:100%;
    height:150px;
    object-fit:contain
  }
  .p{
    color:#B12704;
    font-weight:bold
  }
</style>
</head>
  <body>
<div class="h">
  <div>DHAWAN MALL</div>
  <div class="s">
    <input id="q" placeholder="Search" onkeyup="search()">
    <button onclick="search()">🔍</button>
  </div>
</div>
<div id="msg" style="text-align:center;padding:30px;font-size:20px">Loading your products...</div>
<div id="list" class="g"></div>
<script>
const URL="https://docs.google.com/spreadsheets/d/1xdVlcU-AZsWrduaNkB8fTfeC53iIl6xhxJVFFFTIIQQ/export?format=csv";
let ALL=[];
fetch(URL).then(r=>r.text()).then(t=>{
  let rows=t.split('\n').slice(1);
  ALL=rows.map((r,i)=>{
    let c=r.split(',');
    let name=c[0]?.replace(/"/g,'').trim();
    let price=parseInt(c[1]?.replace(/[^0-9]/g,''));
    if(!name ||!price) return null;
    let mrp=parseInt(c[2]?.replace(/[^0-9]/g,''))||Math.floor(price*1.3);
    let img=c[3]?.replace(/"/g,'').trim()||'https://via.placeholder.com/300';
    return {name,price,mrp,img};
  }).filter(Boolean);
  document.getElementById('msg').style.display='none';
  show(ALL);
}).catch(e=>{
  document.getElementById('msg').innerHTML='Sheet error: '+e+' <br> Sheet public karo';
});
function show(arr){
  document.getElementById('list').innerHTML=arr.map(p=>`
    <div class="c"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/300'"><div>${p.name}</div><div class="p">₹${p.price}</div><div style="font-size:12px;text-decoration:line-through">₹${p.mrp}</div><button onclick="alert('Added '+this.parentElement.children[1].innerText)" style="width:100%;margin-top:5px;background:#ffd814;border:1px solid #fcd200;padding:6px;border-radius:20px">Add to Cart</button></div>
  `).join('');
}
function search(){
  let k=document.getElementById('q').value.toLowerCase();
  show(ALL.filter(p=>p.name.toLowerCase().includes(k)));
}
</script>
</body>
</html>
